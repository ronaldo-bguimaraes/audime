name: audime

services:
  redis:
    image: redis:7-alpine
    container_name: audime-redis
    restart: unless-stopped
    ports:
      # loopback only — Redis has no auth, never expose it to the LAN
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: audime-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: audime-worker
    restart: unless-stopped
    command: arq app.workers.arq_settings.WorkerSettings
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: audime-web
    restart: unless-stopped
    ports:
      # loopback only — public access goes through the Cloudflare Tunnel
      # (8080 is taken by Airflow from another project on this host)
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  # Public entrypoint: Cloudflare Tunnel (outbound-only, no open ports).
  # Runs on the host network so the dashboard ingress can use
  # http://localhost:<WEB_PORT> as well as the compose name web:80.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: audime-cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy

networks:
  default:
    name: audime_network
