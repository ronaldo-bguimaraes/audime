# Security Policy — Tool-Agnostic
# This policy is the source of truth for permissions.
# No iteration may reduce these restrictions (no-downgrade).

version: 1.0.0

rules:
  # Files agents may modify
  - path: "docs/*"
    action: allow_write
    reason: "Cycle documentation"

  - path: ".agents/state/*"
    action: allow_write
    reason: "Persistent state between cycles"

  - path: "src/*"
    action: allow_write
    reason: "Project source code"

  - path: ".agents/policies/*"
    action: deny_write
    reason: "Security policies are immutable between cycles"

  # Blocked commands
  - command: "rm *"
    action: deny
    reason: "Prevent accidental removal"

  - command: "sudo *"
    action: deny
    reason: "No elevated privileges"

  - command: "chmod *"
    action: deny
    reason: "No permission modification"

  - command: "curl * | bash"
    action: deny
    reason: "No remote script execution"

  # No-downgrade guarantee
  - rule: "any relaxation from deny → allow in policies/ is prohibited"
    severity: critical
